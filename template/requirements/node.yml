# Copy this file to requirements/<your-project>.yml and edit the lists below.
# Unknown keys are a hard error by design: a typo in a copied profile fails the
# render instead of being silently ignored.
#
# Render:  ../scripts/render.py --profile requirements/node.yml
# Only `name` is required; every other key falls back to the documented default.
name: node
description: Node.js 24 with pnpm and TypeScript, plus the toolchain node-gyp needs.

apt:
  packages:
    - ca-certificates
    - git
    - curl
    - jq
    - build-essential
    # node-gyp compiles native addons against these.
    - python3

node:
  major: 24
  npm_globals:
    - pnpm
    - typescript
